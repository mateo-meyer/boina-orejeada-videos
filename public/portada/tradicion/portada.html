<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PF;src:url(PlayfairDisplay-Bold.ttf);font-weight:700}
@font-face{font-family:PF;src:url(PlayfairDisplay-SemiBoldItalic.ttf);font-style:italic;font-weight:700}
@font-face{font-family:IN;src:url(Inter-Bold.otf);font-weight:700}
@font-face{font-family:IN;src:url(Inter-SemiBold.otf);font-weight:600}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#2D3050;position:relative;font-family:IN}
.rays{position:absolute;left:50%;top:1010px;width:2600px;height:2600px;margin:-1300px;border-radius:50%;
 background:repeating-conic-gradient(from 0deg,#3b416f 0deg 7deg,#2D3050 7deg 15deg);}
.halo{position:absolute;left:50%;top:1010px;width:1100px;height:1100px;margin:-550px;border-radius:50%;
 background:radial-gradient(circle,#9C6B3E 0%,#6B4A2F 45%,rgba(45,48,80,0) 70%);opacity:.9}
.top{position:absolute;top:262px;width:100%;text-align:center}
.pill{display:inline-block;background:#EFE6D6;color:#2D3050;font-weight:700;font-size:34px;letter-spacing:6px;padding:14px 30px;border-radius:12px;transform:rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.t1{position:absolute;top:360px;width:100%;text-align:center;font-family:PF;font-style:italic;font-size:92px;color:#D9B48A;line-height:1}
.t2{position:absolute;top:452px;width:100%;text-align:center;font-weight:700;font-size:168px;letter-spacing:-5px;color:#FBF7F1;line-height:1;text-shadow:0 10px 0 #1C1A17}
.st{position:absolute;left:50%;top:640px;width:860px;margin-left:-430px;transform:rotate(-4deg);filter:drop-shadow(0 26px 30px rgba(0,0,0,.55))}
.tag{position:absolute;font-weight:700;box-shadow:0 10px 22px rgba(0,0,0,.4);border-radius:14px}
.nombre{left:96px;top:1415px;background:#FBF7F1;color:#2D3050;font-family:PF;font-size:78px;padding:14px 32px 20px;transform:rotate(-5deg)}
.anio{right:92px;top:1300px;background:#9C6B3E;color:#FBF7F1;font-size:40px;letter-spacing:3px;padding:14px 26px;transform:rotate(6deg)}
.mf{right:120px;top:1540px;background:#2D3050;color:#D9B48A;font-family:PF;font-style:italic;font-size:54px;padding:10px 26px 16px;border:4px solid #D9B48A;transform:rotate(3deg)}
.logo{position:absolute;left:50%;top:1640px;width:150px;margin-left:-75px}
</style></head><body>
<div class="rays"></div><div class="halo"></div>
<div class="top"><span class="pill">10 DE NOVIEMBRE</span></div>
<div class="t1">¡Feliz Día de la</div>
<div class="t2">TRADICIÓN!</div>
<img class="st" src="jh-sticker.png">
<div class="tag anio">NACIÓ EL 10/11/1834</div>
<div class="tag nombre">José Hernández</div>
<div class="tag mf">el del Martín Fierro</div>
<img class="logo" src="logo-sobre-azul.png">
</body></html>
